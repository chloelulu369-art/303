<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dni</title>
</head>
<body>
    <script>
    var letras = ['T', 'R', 'W', 'A', 'G', 'M', 'Y', 'F', 'P', 'D', 'X', 'B', 'N', 'J', 'Z', 'S', 'Q', 'V', 'H', 'L', 'C', 'K', 'E', 'T'];
    var dni = prompt("Por favor, escribe tu dni:");
    if(dni <0 || dni >99999999){
     console.log("El número proporcionado no es válido");   
    }
    else{
    var numdni=dni % 23
    var letra=letras[numdni];
    }
    console.log(dni, letra);
    </script>   
</body>
</html>
